import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id "org.openapi.generator" version "7.17.0"
}

openApiGenerate {
    generatorName.set("kotlin")
    inputSpec.set("$projectDir/src/main/res/api-docs.json")
    outputDir.set("${layout.buildDirectory.get()}/generated/api")
    apiPackage.set("ru.runa.wfe.restapi.client")
    modelPackage.set("ru.runa.wfe.restapi.model")
    packageName.set("ru.runa.wfe.restapi")
    configOptions.put("openApiNullable", "false")
    configOptions.put("library", "jvm-retrofit2")
    configOptions.put("useCoroutines", "true")
    configOptions.put("useResponseAsReturnType", "true")
    configOptions.put("serializationLibrary", "jackson")
    configOptions.put("failOnUnknownProperties", "false")
}

tasks.register('prepareKotlinBuildScriptModel') {

}

tasks.withType(KotlinCompile).configureEach {
    dependsOn('openApiGenerate')
}

android {
    namespace 'ru.runa.wfe'
    compileSdk 35
    flavorDimensions = ["version"]

    defaultConfig {
        applicationId "ru.runa.wfe"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildFeatures {
        buildConfig = true
        viewBinding true
    }
    productFlavors {
        original {
            dimension "version"
            applicationId "ru.runa.wfe.free"
            versionNameSuffix = "-v1"
        }
        parallel {
            dimension "version"
            applicationId "ru.runa.wfe.free.parallel"
            versionNameSuffix = "-v2"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets {
        main {
            java.srcDirs = ['src/main/java', 'build/generated/api/src/main/kotlin']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation "androidx.activity:activity-ktx:1.10.1"
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.6'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.6'
    implementation 'androidx.datastore:datastore-preferences:1.2.0'
    implementation 'androidx.datastore:datastore:1.2.0'
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.9.0'
    implementation 'com.squareup.retrofit2:converter-jackson:2.1.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin:2.20.1'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'androidx.work:work-runtime-ktx:2.11.2'
    implementation 'com.google.crypto.tink:tink-android:1.23.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

}